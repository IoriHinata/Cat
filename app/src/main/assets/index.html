<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animal Collector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header><span>🐱</span><div><h1>Animal Collector</h1><p id="status" role="status">Запуск Python-движка…</p></div></header>
      <section id="game" hidden>
        <article class="hero"><p id="profile"></p><strong id="points"></strong><small id="level"></small></article>
        <div class="actions">
          <button id="add-card">Добавить находку</button>
          <button id="camera" class="secondary">Разрешить камеру</button>
        </div>
        <form id="profile-form"><label>Имя исследователя <input id="profile-name" maxlength="40" required /></label><button>Сохранить профиль</button></form>
        <section><h2>Коллекция</h2><ul id="cards"></ul></section>
      </section>
      <pre id="error" hidden></pre>
    </main>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
