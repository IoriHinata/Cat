name: Build Android APK

on:
  push:
    branches: [work, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-24.04
    env:
      # This is the Android SDK already provided by the GitHub-hosted Ubuntu image.
      # Do not invoke setup-android: it can replace the preinstalled sdkmanager and
      # fail while downloading command-line tools before Gradle gets a chance to run.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      # The repository deliberately contains no binary Gradle wrapper.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Print build environment
        run: |
          java -version
          gradle --version
          echo "Using Android SDK: $ANDROID_HOME"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --info
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info
      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: animal-collector-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: animal-collector-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
