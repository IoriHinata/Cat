name: Build Android APK

on:
  push:
    branches: [work, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK API 35
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      # The repository deliberately contains no binary Gradle wrapper.
      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Print build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list | sed -n '1,80p'
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --info
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info
      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: animal-collector-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: animal-collector-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
